[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heapline-gate"
version = "0.2.0"
description = "Fail a build when a program's heap peak, measured by heapline, exceeds a budget."
readme = "README.md"
requires-python = ">=3.8"
# The table form, not an SPDX string: that needs setuptools 77, which no
# longer runs on Python 3.8.
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ethan-puyaubreau/heapline-gate"
heapline = "https://github.com/ethan-puyaubreau/heapline"

[project.scripts]
heapline-gate = "heapline_gate.cli:main"

[tool.setuptools]
packages = ["heapline_gate"]
