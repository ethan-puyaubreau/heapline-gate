[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heapline-gate"
version = "0.2.0"
description = "Fail a build when a program's heap peak, measured by heapline, exceeds a budget."
readme = "README.md"
requires-python = ">=3.8"
# The table form, not an SPDX string: that needs setuptools 77, which no
# longer runs on Python 3.8.
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ethan-puyaubreau/heapline-gate"
heapline = "https://github.com/ethan-puyaubreau/heapline"

[project.scripts]
heapline-gate = "heapline_gate.cli:main"

[tool.setuptools]
packages = ["heapline_gate"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "coverage"]

[tool.ruff]
target-version = "py38"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The code formats with %, as its messages always have.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# Long lines are the commands under test.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["heapline_gate"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
branch = true
source = ["heapline_gate"]

[tool.coverage.report]
# 99% today; the rest is __main__.py, which the installed-command CI job runs.
fail_under = 95
show_missing = true
