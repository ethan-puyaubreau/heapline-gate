name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # heapline can change its format while this repository does not move.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}, installed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python that pyproject.toml accepts, and the newest.
          - python: '3.8'
            os: ubuntu-24.04
          - python: '3.13'
            os: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test
        run: python -m unittest discover -s tests -v

      # From outside the source tree, so that the installed package is used.
      - name: Install and run the command
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          heapline-gate --help
          python -c "import heapline_gate.cli, sys; sys.exit(not heapline_gate.cli.__file__.startswith(sys.prefix))"

  test:
    name: Test against heapline ${{ matrix.heapline }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        heapline: [ release, main ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the latest release of heapline
        if: matrix.heapline == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ethan-puyaubreau/heapline --pattern '*-linux-x86_64.tar.gz*'
          sha256sum -c heapline-v*-linux-x86_64.tar.gz.sha256
          tar xzf heapline-v*-linux-x86_64.tar.gz
          echo "HEAPLINE_LIB=$(echo "$PWD"/heapline-v*-linux-x86_64/lib/libheapline.so)" >> "$GITHUB_ENV"

      # Catches a format change before heapline releases it.
      - name: Checkout heapline main
        if: matrix.heapline == 'main'
        uses: actions/checkout@v4
        with:
          repository: ethan-puyaubreau/heapline
          path: heapline-src

      - name: Build heapline main
        if: matrix.heapline == 'main'
        run: |
          cmake -S heapline-src -B heapline-src/build -DCMAKE_BUILD_TYPE=Release -DHEAPLINE_ENABLE_TESTS=OFF
          cmake --build heapline-src/build --parallel --target heapline
          echo "HEAPLINE_LIB=$PWD/heapline-src/build/libheapline.so" >> "$GITHUB_ENV"

      # With HEAPLINE_LIB set, the contract tests run the real library.
      - name: Test
        run: python3 -m unittest discover -s tests -v

  package:
    name: heapline package on ${{ matrix.distro }}, ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'x86_64' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is free for public repositories.
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
        distro: [ ubuntu, rocky8, rocky9 ]
        include:
          # RHEL 8's own python3 is 3.6, older than heapline-gate accepts.
          - distro: rocky8
            image: rockylinux:8
            python: python3.11
          - distro: rocky9
            image: rockylinux:9
            python: python3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The commands of the README.
      - name: Install the .deb of the latest release of heapline
        if: matrix.distro == 'ubuntu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arch=$(dpkg --print-architecture)
          gh release download --repo ethan-puyaubreau/heapline --pattern "heapline_*_${arch}.deb*"
          sha256sum -c heapline_*_${arch}.deb.sha256
          sudo apt-get install -y ./heapline_*_${arch}.deb

      - name: Test
        if: matrix.distro == 'ubuntu'
        run: sh .github/check-installed.sh python3 sudo apt-get remove -y heapline

      # On the runner: the container has no gh.
      - name: Download the .rpm of the latest release of heapline
        if: matrix.distro != 'ubuntu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ethan-puyaubreau/heapline --pattern "heapline-*.el8.$(uname -m).rpm*"
          sha256sum -c heapline-*.el8.$(uname -m).rpm.sha256

      - name: Install it in ${{ matrix.image }} and test
        if: matrix.distro != 'ubuntu'
        env:
          IMAGE: ${{ matrix.image }}
          PYTHON: ${{ matrix.python }}
        run: |
          rpm=$(echo heapline-*.el8.$(uname -m).rpm)
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" sh -c \
            "dnf install -y ./$rpm $PYTHON && sh .github/check-installed.sh $PYTHON dnf remove -y heapline"
